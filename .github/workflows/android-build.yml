name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # services.gradle.org intermittently 504s / times out on the wrapper
        # download; retry the whole build a few times instead of failing fast.
        run: |
          for i in 1 2 3; do
            if ./gradlew assembleDebug --stacktrace; then
              break
            fi
            echo "Build attempt $i failed; waiting 60s before retry..."
            sleep 60
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: run-v2-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
